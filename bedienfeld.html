<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedienfeld</title>
    <link rel="stylesheet" href="bedienfeld.css">
</head>
<body>
    <!-- Settings Button -->
    <div class="settings-button" id="settingsBtn">⚙</div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">
                <div class="settings-title">OPC UA Server Einstellungen</div>
                <div class="close-button" id="closeModal">×</div>
            </div>

            <div class="connection-status" id="connectionStatus">
                Verbindungsstatus wird geladen...
            </div>

            <form class="settings-form" id="settingsForm">
                <div class="form-group">
                    <label class="form-label" for="serverEndpoint">Server Endpoint:</label>
                    <input
                        type="text"
                        id="serverEndpoint"
                        class="form-input"
                        placeholder="opc.tcp://192.168.1.100:4842"
                        required
                    />
                </div>

                <div class="form-buttons">
                    <button type="submit" class="save-button">Verbinden</button>
                    <button type="button" class="cancel-button" id="cancelBtn">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>

    <div class="panel">
        <!-- Toolcontrol Section -->
        <div class="label-toolcontrol">Toolcontrol</div>
        <button class="button button-gray" id="toolOnBtn">Tool On</button>
        <button class="button button-gray" id="toolOffBtn">Tool Off</button>

        <!-- Start/Stop Buttons -->
        <button class="button button-green" id="startBtn">Start</button>
        <button class="button button-red" id="stopBtn">Stop</button>

        <!-- Toggle Switch -->
        <div class="label-toolmode">Toolmode</div>
        <div class="toggle-track" id="toggleTrack">
            <div class="toggle-slider"></div>
        </div>

        <!-- Reset Button -->
        <div class="label-reset">Reset/Quit</div>
        <button class="button button-gray" id="resetBtn">Reset</button>

        <!-- MAN Indicator -->
        <div class="label-man">MAN</div>
        <div class="indicator" id="manIndicator"></div>

        <!-- ERROR Indicator -->
        <div class="label-error">ERROR</div>
        <div class="indicator" id="errorIndicator"></div>

        <!-- Current Step -->
        <div class="label-step">Current Step</div>
        <div class="step-value">00</div>

        <!-- Emergency Stop -->
        <div class="label-emergency">Emergency STOP</div>
        <div class="emergency-button"></div>

        <!-- Actuator Section Background -->
        <div class="actuator-background"></div>
        <div class="label-actuator">Actuator Selection</div>
        <button class="button button-gray" id="homeBtn">Home</button>
        <button class="button button-gray" id="workBtn">Work</button>
        <select class="dropdown" id="actuatorDropdown">
            <option value="1">Actuator 1</option>
            <option value="2">Actuator 2</option>
            <option value="3">Actuator 3</option>
            <option value="4">Actuator 4</option>
            <option value="5">Actuator 5</option>
            <option value="6">Actuator 6</option>
            <option value="7">Actuator 7</option>
            <option value="8">Actuator 8</option>
            <option value="9">Actuator 9</option>
            <option value="10">Actuator 10</option>
        </select>
    </div>

    <script>
        const API_URL = 'http://localhost:3001';

        // Hilfsfunktion für API Aufrufe
        async function callAPI(endpoint, body = null) {
            try {
                const options = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                };

                if (body) {
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(API_URL + endpoint, options);
                const data = await response.json();
                console.log(`API Call ${endpoint}:`, data);
                return data;
            } catch (error) {
                console.error(`Fehler bei API Call ${endpoint}:`, error);
                alert('Fehler: Verbindung zum Server fehlgeschlagen');
            }
        }

        // Hilfsfunktion für Taster-Verhalten (Press & Release)
        function setupButton(element, pressEndpoint, releaseEndpoint) {
            // Mouse Events
            element.addEventListener('mousedown', (e) => {
                e.preventDefault();
                callAPI(pressEndpoint);
            });

            element.addEventListener('mouseup', (e) => {
                e.preventDefault();
                callAPI(releaseEndpoint);
            });

            element.addEventListener('mouseleave', (e) => {
                // Wenn Maus den Button verlässt während gedrückt, auch release senden
                callAPI(releaseEndpoint);
            });

            // Touch Events für Touch-Displays
            element.addEventListener('touchstart', (e) => {
                e.preventDefault();
                callAPI(pressEndpoint);
            });

            element.addEventListener('touchend', (e) => {
                e.preventDefault();
                callAPI(releaseEndpoint);
            });

            element.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                callAPI(releaseEndpoint);
            });
        }

        // Tool On Button (Taster)
        setupButton(document.getElementById('toolOnBtn'), '/tool-on-press', '/tool-on-release');

        // Tool Off Button (Taster)
        setupButton(document.getElementById('toolOffBtn'), '/tool-off-press', '/tool-off-release');

        // Start Button (Taster)
        setupButton(document.getElementById('startBtn'), '/start-press', '/start-release');

        // Stop Button (Taster)
        setupButton(document.getElementById('stopBtn'), '/stop-press', '/stop-release');

        // Reset Button (Taster)
        setupButton(document.getElementById('resetBtn'), '/reset-press', '/reset-release');

        // Home Button (Taster)
        setupButton(document.getElementById('homeBtn'), '/home-press', '/home-release');

        // Work Button (Taster)
        setupButton(document.getElementById('workBtn'), '/work-press', '/work-release');

        // Emergency Stop Button (Schalter - NOT-AUS-Pilz)
        // Logik: Gedrückt = xEM_STOP false, Nicht gedrückt = xEM_STOP true
        const emergencyButton = document.querySelector('.emergency-button');
        let emergencyPressed = false; // Lokaler Zustand

        emergencyButton.addEventListener('click', async function() {
            emergencyPressed = !emergencyPressed; // Toggle

            if (emergencyPressed) {
                // NOT-AUS gedrückt -> xEM_STOP = false
                this.classList.add('pressed');
                await callAPI('/set-emstop', { active: false });
                console.log('NOT-AUS aktiviert (gedrückt) - xEM_STOP = false');
            } else {
                // NOT-AUS entriegelt -> xEM_STOP = true
                this.classList.remove('pressed');
                await callAPI('/set-emstop', { active: true });
                console.log('NOT-AUS deaktiviert (entriegelt) - xEM_STOP = true');
            }
        });

        // Actuator Dropdown - Selection
        const actuatorDropdown = document.getElementById('actuatorDropdown');
        actuatorDropdown.addEventListener('change', function() {
            const selectedActuator = parseInt(this.value);
            console.log(`Actuator ${selectedActuator} ausgewählt`);
            callAPI('/set-actuator', { actuator: selectedActuator });
        });

        // Toggle Switch Funktionalität (Manual/Auto Mode)
        document.getElementById('toggleTrack').addEventListener('click', function() {
            this.classList.toggle('active');
            const isManual = !this.classList.contains('active');
            console.log(`Modus: ${isManual ? 'Manual' : 'Auto'}`);
            callAPI('/set-mode', { manual: isManual });
        });

        // Referenzen zu den Indikatoren und Buttons
        const manIndicator = document.getElementById('manIndicator');
        const errorIndicator = document.getElementById('errorIndicator');

        // Button Referenzen für Lampen
        const toolOnButton = document.getElementById('toolOnBtn');
        const toolOffButton = document.getElementById('toolOffBtn');
        const startButton = document.getElementById('startBtn');
        const resetButton = document.getElementById('resetBtn');

        // Status regelmäßig aktualisieren (jede 100 ms)
        setInterval(async () => {
            try {
                const response = await fetch(API_URL + '/status');
                const status = await response.json();

                // Current Step aktualisieren
                if (status.currentStep !== undefined) {
                    const stepDisplay = document.querySelector('.step-value');
                    stepDisplay.textContent = String(status.currentStep).padStart(2, '0');
                }

                // PV Actuator aktualisieren (Dropdown-Auswahl synchronisieren)
                if (status.pvActuator !== undefined && status.pvActuator >= 1 && status.pvActuator <= 10) {
                    actuatorDropdown.value = status.pvActuator;
                }

                // MAN Indicator aktualisieren (grün wenn xP_MAN = true)
                if (status.panelMan !== undefined) {
                    if (status.panelMan) {
                        manIndicator.classList.add('man-active');
                    } else {
                        manIndicator.classList.remove('man-active');
                    }
                }

                // ERROR Indicator aktualisieren (rot blinkend wenn xP_ERROR = true)
                if (status.panelError !== undefined) {
                    if (status.panelError) {
                        errorIndicator.classList.add('error-active');
                    } else {
                        errorIndicator.classList.remove('error-active');
                    }
                }

                // Tool On/Off Button Lampen (blau, gegenseitig exklusiv)
                if (status.panelToolOn !== undefined) {
                    if (status.panelToolOn) {
                        // Tool On aktiv -> Tool On leuchtet blau, Tool Off aus
                        toolOnButton.classList.add('lamp-blue');
                        toolOffButton.classList.remove('lamp-blue');
                    } else {
                        // Tool Off aktiv -> Tool Off leuchtet blau, Tool On aus
                        toolOnButton.classList.remove('lamp-blue');
                        toolOffButton.classList.add('lamp-blue');
                    }
                }

                // Start Button Lampe (grün wenn xP_START = true)
                if (status.panelStart !== undefined) {
                    if (status.panelStart) {
                        startButton.classList.add('lamp-green');
                    } else {
                        startButton.classList.remove('lamp-green');
                    }
                }

                // Reset Button Lampe (weiß wenn xP_RESET = true)
                if (status.panelReset !== undefined) {
                    if (status.panelReset) {
                        resetButton.classList.add('lamp-white');
                    } else {
                        resetButton.classList.remove('lamp-white');
                    }
                }

                // Emergency Stop Status synchronisieren
                // xEM_STOP = false -> NOT-AUS gedrückt
                // xEM_STOP = true -> NOT-AUS nicht gedrückt
                if (status.emergencyStop !== undefined) {
                    if (status.emergencyStop === false) {
                        // NOT-AUS ist gedrückt
                        emergencyButton.classList.add('pressed');
                        emergencyPressed = true;
                    } else {
                        // NOT-AUS ist nicht gedrückt (normal)
                        emergencyButton.classList.remove('pressed');
                        emergencyPressed = false;
                    }
                }

                console.log('Status Update:', status);
            } catch (error) {
                // Silent fail bei Status Updates
            }
        }, 100); // war vorher 1000 ms

        // ========== Settings Modal Funktionalität ==========

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeModal = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const settingsForm = document.getElementById('settingsForm');
        const serverEndpointInput = document.getElementById('serverEndpoint');
        const connectionStatus = document.getElementById('connectionStatus');

        // Modal öffnen
        settingsBtn.addEventListener('click', async () => {
            settingsModal.classList.add('active');

            // Aktuelle Konfiguration laden
            try {
                const response = await fetch(API_URL + '/config');
                const config = await response.json();
                serverEndpointInput.value = config.currentEndpoint;
                updateConnectionStatus(true);
            } catch (error) {
                console.error('Fehler beim Laden der Konfiguration:', error);
                updateConnectionStatus(false);
            }
        });

        // Modal schließen
        closeModal.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        cancelBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        // Modal schließen bei Klick außerhalb
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('active');
            }
        });

        // Form Submit - Reconnect
        settingsForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newEndpoint = serverEndpointInput.value.trim();

            if (!newEndpoint) {
                alert('Bitte gib einen gültigen Endpoint ein');
                return;
            }

            // Verbindungsstatus auf "wird verbunden" setzen
            connectionStatus.textContent = 'Verbindung wird hergestellt...';
            connectionStatus.className = 'connection-status';

            try {
                const response = await fetch(API_URL + '/reconnect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ endpoint: newEndpoint })
                });

                const result = await response.json();

                if (result.success) {
                    updateConnectionStatus(true);
                    alert('Erfolgreich mit neuem Server verbunden!');

                    // Modal nach erfolgreicher Verbindung schließen
                    setTimeout(() => {
                        settingsModal.classList.remove('active');
                    }, 1000);
                } else {
                    updateConnectionStatus(false);
                    alert('Verbindung fehlgeschlagen: ' + (result.error || 'Unbekannter Fehler'));
                }
            } catch (error) {
                console.error('Fehler beim Reconnect:', error);
                updateConnectionStatus(false);
                alert('Verbindung zum API Server fehlgeschlagen');
            }
        });

        // Verbindungsstatus aktualisieren
        function updateConnectionStatus(isConnected) {
            if (isConnected) {
                connectionStatus.textContent = '✓ Verbunden';
                connectionStatus.className = 'connection-status connected';
            } else {
                connectionStatus.textContent = '✗ Nicht verbunden';
                connectionStatus.className = 'connection-status disconnected';
            }
        }
    </script>
</body>
</html>
